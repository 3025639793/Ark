name: Build and release Windows album

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:win -- --publish never
      - name: Add checksum
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/Ark-*-windows-x64.zip | Select-Object -First 1
          if (-not $archive) { throw 'Windows package is missing' }
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($archive.FullName).sha256", "$hash  $($archive.Name)`n")
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = Get-ChildItem release/Ark-*-windows-x64.zip | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $archive.FullName "$($archive.FullName).sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --title "Ark $env:GITHUB_REF_NAME · Windows 本地相册" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
