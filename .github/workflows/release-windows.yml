name: Build and release Windows album

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:win -- --publish never
      - run: node scripts/verify-windows-release.cjs
      - name: Initialize native theme and capture preview
        run: |
          node node_modules/electron/install.js
          npx electron scripts/capture-preview.cjs
      - name: Add checksum
        shell: pwsh
        run: |
          $archives = Get-ChildItem release/Ark-* | Where-Object { $_.Extension -in '.exe', '.zip' }
          if ($archives.Count -lt 2) { throw 'Installer or ZIP is missing' }
          foreach ($archive in $archives) {
            $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText("$($archive.FullName).sha256", "$hash  $($archive.Name)`n")
          }
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '^Ark-.*\.(exe|zip|blockmap|sha256)$' -or $_.Name -in 'latest.yml', 'preview.png' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Ark $env:GITHUB_REF_NAME · Windows 本地相册" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
