# 此配置会创建付费服务。请在 Render 中查看费用后再部署。
services:
  - type: web
    name: ark-image-library
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: ARK_PASSWORD
        sync: false
      - key: ARK_SECURE_COOKIE
        value: "1"
      - key: ARK_DATA_DIR
        value: /var/data/ark
    disk:
      name: ark-images
      mountPath: /var/data
      sizeGB: 10
